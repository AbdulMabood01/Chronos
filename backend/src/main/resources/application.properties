spring.application.name=chronos

# Server
server.port=8080
server.servlet.context-path=/api

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/chronos_dev
spring.datasource.username=chronos_user
spring.datasource.password=chronos_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# OAuth2 / Microsoft Entra ID Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${ENTRA_ID_ISSUER_URI:}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${ENTRA_ID_JWK_SET_URI:https://login.microsoftonline.com/common/discovery/v2.0/keys}

# Application Configuration
chronos.initialSuperAdminEmail=${INITIAL_SUPER_ADMIN_EMAIL:superadmin@maxwellnetwork.org}
chronos.companyDomain=${COMPANY_DOMAIN:maxwellnetwork.org}
chronos.jwtSigningKey=${JWT_SIGNING_KEY:your-secret-key-change-in-production}

# Logging
logging.level.root=INFO
logging.level.com.maxwell.chronos=DEBUG
logging.level.org.springframework.security=DEBUG

# Jackson Configuration
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

chronos.jwtAudience=${ENTRA_ID_AUDIENCE:}
