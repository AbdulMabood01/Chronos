spring.application.name=chronos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=21MB

# Server
server.port=8080
server.servlet.context-path=/api

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/chronos_dev
spring.datasource.username=chronos_user
spring.datasource.password=chronos_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Authentication configuration: no signing key default.
chronos.jwtSigningKey=${JWT_SIGNING_KEY}
chronos.jwt.issuer=${JWT_ISSUER:chronos}
chronos.jwt.audience=${JWT_AUDIENCE:chronos-web}
chronos.jwt.lifetime-seconds=${JWT_EXPIRATION_SECONDS:3600}
chronos.invitation.hours=${INVITATION_EXPIRATION_HOURS:72}
chronos.frontend-url=${FRONTEND_URL:}
chronos.bootstrap.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
chronos.bootstrap.email=${INITIAL_SUPER_ADMIN_EMAIL:}
chronos.bootstrap.first-name=${INITIAL_SUPER_ADMIN_FIRST_NAME:}
chronos.bootstrap.last-name=${INITIAL_SUPER_ADMIN_LAST_NAME:}

# Logging
logging.level.root=INFO
logging.level.com.maxwell.chronos=INFO
logging.level.org.springframework.security=INFO
# Report bodies, internal notes and JDBC parameters must not appear in debug logs.
logging.level.org.springframework.web=INFO
logging.level.org.springframework.jdbc=INFO
spring.mvc.log-request-details=false

# Jackson Configuration
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600


# Reminders are sent at 8 PM in each employee's profile timezone.
chronos.app-url=${CHRONOS_APP_URL:http://localhost:5173}
chronos.mail.from=${MAIL_FROM:}
# Configure SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME and
# SPRING_MAIL_PASSWORD in the deployment environment to enable SMTP delivery.
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL_ENABLE:false}
