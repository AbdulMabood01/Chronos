# Local-only observability profile. Start with:
#   $env:SPRING_PROFILES_ACTIVE = 'local-monitoring'; mvn spring-boot:run

# Expose only endpoints consumed by the local stack. SecurityConfig separately
# allowlists these exact paths instead of permitting the entire Actuator tree.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# SMTP is intentionally often absent in local development; do not mark the
# whole application DOWN solely because no local mail server is configured.
management.health.mail.enabled=false

# Stable, low-cardinality tags shared by application metrics.
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=local

# Publish histogram buckets so Prometheus can compute p95 server latency.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,250ms,500ms,1s,2s,5s

# Structured ECS JSON is written only in this profile. Alloy tails this file;
# console output remains human-readable for local development.
logging.file.name=${CHRONOS_LOG_FILE:../monitoring/logs/chronos.json}
logging.structured.format.file=ecs
logging.structured.ecs.service.name=${spring.application.name}
logging.structured.ecs.service.environment=local
logging.structured.json.add.application=${spring.application.name}
logging.structured.json.add.environment=local
logging.structured.json.stacktrace.max-length=8192
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=3
logging.logback.rollingpolicy.total-size-cap=30MB

# OpenTelemetry Spring instrumentation captures inbound HTTP and sanitized JDBC
# spans and injects trace_id/span_id into Logback MDC. Metrics stay pull-based
# through Prometheus, and logs stay file-based through Alloy.
otel.sdk.disabled=false
otel.service.name=${spring.application.name}
otel.resource.attributes=deployment.environment.name=local,service.namespace=chronos
otel.propagators=tracecontext,baggage
otel.traces.exporter=otlp
otel.metrics.exporter=none
otel.logs.exporter=none
otel.exporter.otlp.protocol=http/protobuf
otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
otel.traces.sampler=parentbased_always_on

# Privacy defaults: SQL literal values are sanitized, bind/query parameters and
# authenticated end-user attributes are not recorded.
otel.instrumentation.common.db.query-sanitization.enabled=true
otel.instrumentation.jdbc.capture-query-parameters=false
otel.instrumentation.common.enduser.id.enabled=false
otel.instrumentation.common.enduser.role.enabled=false
otel.instrumentation.common.enduser.scope.enabled=false
